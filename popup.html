<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>MAC Formatter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <section id="pasteZone" class="paste-zone" tabindex="0" aria-label="이미지 붙여넣기 영역">
        <strong>이미지를 붙여넣으세요 (Ctrl+V)</strong>
        <small>이미지 파일을 끌어다 놓아도 됩니다</small>
      </section>

      <section id="previewSection" hidden>
        <canvas id="preview" aria-label="붙여넣은 이미지 미리보기"></canvas>
        <div class="toolbar">
          <button id="selectRegion" type="button">영역 직접 선택</button>
          <button id="resetRegion" type="button" hidden>전체 다시 인식</button>
        </div>
      </section>

      <p id="status" role="status" aria-live="polite">모델 준비 중...</p>
      <ul id="chips" class="chips"></ul>

      <div class="options">
        <label>구분자
          <select id="separator">
            <option value="-">-</option>
            <option value=":">:</option>
            <option value="">없음</option>
          </select>
        </label>
        <label>대소문자
          <select id="letterCase">
            <option value="upper">대문자</option>
            <option value="lower">소문자</option>
          </select>
        </label>
      </div>

      <details id="manual">
        <summary>직접 입력</summary>
        <div class="manual-row">
          <input type="text" id="macInput" placeholder="Enter MAC address" />
          <button id="formatButton" type="button">Format</button>
        </div>
        <p id="result"></p>
      </details>

      <p class="note">이미지는 이 PC 밖으로 전송되지 않습니다. 인식 결과는 틀릴 수 있으니 이미지와 대조한 뒤 복사하세요.</p>
    </main>

    <script src="vendor/onnx/ort.wasm.min.js"></script>
    <script src="mac-utils.js"></script>
    <script src="preprocess.js"></script>
    <script src="detect.js"></script>
    <script src="ocr.js"></script>
    <script src="recognizer.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
