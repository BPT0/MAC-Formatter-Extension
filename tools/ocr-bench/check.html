<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>인식 파이프라인 확인</title>
    <style>
      body { font-family: sans-serif; padding: 16px; font-size: 13px; }
      table { border-collapse: collapse; margin-bottom: 24px; }
      th, td { border: 1px solid #ccc; padding: 2px 8px; text-align: left; vertical-align: top; }
      .ok { background: #d7f5dd; }
      .near { background: #fff3c4; }
      .bad { background: #fde0e0; }
    </style>
  </head>
  <body>
    <h1>인식 파이프라인 확인 (개발용)</h1>
    <p>recognizer.js(검출 → 줄별 인식 → 칩)를 samples/truth.csv의 실제 이미지와 합성 화면 캡처로 확인한다.</p>
    <button id="run">실행</button>
    <p id="status"></p>
    <div id="out"></div>

    <script src="../../vendor/onnx/ort.wasm.min.js"></script>
    <script src="../../mac-utils.js"></script>
    <script src="../../preprocess.js"></script>
    <script src="../../detect.js"></script>
    <script src="../../ocr.js"></script>
    <script src="../../recognizer.js"></script>
    <script src="check.js"></script>
  </body>
</html>
